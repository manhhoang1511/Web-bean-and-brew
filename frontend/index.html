<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bean & Brew - Cà phê rang xay, trà và dụng cụ pha chế" />
    <title>Bean & Brew – Cà phê rang xay</title>
    <script>
      // Đặt theme trước khi React chạy để không bị "nháy" giao diện sáng
      try {
        var t = localStorage.getItem('bb-theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
